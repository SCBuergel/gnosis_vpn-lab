# vpn-lab configuration. Everything a deployment needs to be reproducible is pinned here.

[lab]
name = "vpn-lab"                 # also the tag on every machine; `destroy` deletes by this tag
provider = "digitalocean"        # a key of [providers.*]; see docs/adding-a-provider.md
network = "piz-palu-prod"
indexer_url = "https://blokli.piz-palu.gnosisvpn.io"
rpc_url = "https://rpc.gnosischain.com"   # only hopli and the funding helper use an RPC
relays = ["relay1", "relay2", "relay3"]
client_user = "gvpnlab"          # the client worker runs per user and cannot be owned by root

[providers.digitalocean]
token_file = "~/do-api-token"
region = "fra1"
size = "c-4"                     # 4 dedicated vCPU, 8 GB; $0.125 per hour on 2026-11-21
image = "ubuntu-24-04-x64"

# Funding from the Safe named in the key file. The helper reuses the journaled wallet of
# gnosis_vpn-bench, so it needs that checkout and an interpreter with web3 (the bench's .venv).
[funding]
key_file = "~/key.txt"
bench_path = "~/gnosis_vpn-bench"
deployer_xdai = "0.03"           # gas for the four Safe deployments, sent to a throwaway key
relay_safe_wxhopr = "12"         # 10 key-binding fee + margin; a relay opens no channels
exit_safe_wxhopr = "60"          # 10 fee + 3 channels of 15 (7.5 at opening, one top-up each) + 5 spare
node_xdai = "0.01"
client_margin_wxhopr = "0.01"    # sent on top of what the client asks for
client_xdai = "0.006"            # sent to the client; also the most it may ask for
client_max_wxhopr = "250"        # fund-client refuses a request above this

[software.hopli]
version = "0.20.1"
url = "https://github.com/hoprnet/hopli/releases/download/v0.20.1/hopli-x86_64-linux"
sha256 = "7f7192eeece9c39c4212696729d52194a650688f9817621128d8e28d377360d8"

[software.hoprd]                 # relays: the GitHub release binary (built without exit payments)
version = "5.0.4"
url = "https://github.com/hoprnet/hoprd/releases/download/v5.0.4/hoprd-x86_64-linux"
sha256 = "ecd105592a07ae6998cc67b5da4d001830a8348adba640d0e8878159527a99bc"

[software.hoprd_exit]            # exit: the binary inside the published image is the build with exit payments
image = "europe-west3-docker.pkg.dev/hoprassociation/docker-images/hoprd@sha256:df8fdc183511fee6fbc1fcfb595e7537450eacee77a5044da781fc62bf38496e"
sha256 = "5ee09b44b17364ee701e6a177e0106ac6dbd8e725a0c77f7d58390d5dcaa98a2"

[software.gnosis_vpn_server]
version = "0.7.1"
url = "https://github.com/gnosis/gnosis_vpn-server/releases/download/v0.7.1/gnosis_vpn-server-x86_64-linux"
sha256 = "33fd4bfcb17650761973da5ed862be3119bb2aecea4e6cd3255d60c8a9227c05"

[software.client]
version = "1.1.0"
channel = "stable"
url = "https://download.gnosisvpn.io/linux/apt/pool/main/g/gnosisvpn/gnosisvpn_1.1.0_amd64.deb"
sha256 = "c944e294c408916d21a62e29262af52d5f0f66fe6715056d33c1f407559d7712"
# The official installer sets up the apt source and the service; it is run as root, so it is pinned too.
installer_url = "https://download.vpn.gnosis.eth.limo/linux/install.sh"
installer_sha256 = "59add2768da0ab42073978dfebf75b677b986a9fb4f7e59e1390a62587db506b"

[software.hoprd_cfg]             # config validator matching the relay binary
url = "https://github.com/hoprnet/hoprd/releases/download/v5.0.4/hoprd-cfg-x86_64-linux"
sha256 = "ea3cf32ea9d88c3822c92ec8bd139c4da9cf24ac4fbf1204b57f72e0d9461993"
