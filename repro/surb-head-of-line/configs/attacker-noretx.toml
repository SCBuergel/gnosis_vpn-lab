# SURB head-of-line repro, ATTACKER config WITHOUT bridge retransmission (contention control).
# Identical to attacker-retx.toml except it has no [connection.bridge] retransmission capability.
# With default bridge capabilities the exit owes the bridge session only one return packet per
# request, so its bridge pseudonym does not starve. This arm imposes the same two-client load on
# the exit as the treatment arm, so the difference between the two isolates the head-of-line stall.
version = 7

[pix_strategy]
price_per_byte = "9 000 000 000 wei wxHOPR"
max_ssa_allocation = "9 wxHOPR"
deposit_buffer_period = "500ms"
max_deposit_tracking_time = "3m"
max_deposit_retries = 3
funding_min_available = "6 wxHOPR"
funding_top_up = "35.35 wxHOPR"

[connection.path_planner]
min_paths_anonymity_floor = 3

[connection.pix.dimensions]
num_ssa_parts = 4096
ssa_part_size = 32
additional_shares = 79

[destinations.lab2exit]
address = "0xe18960da6c134aa4efd1de90547bcd6d032557b6"
path = { hops = 1 }
meta = { location = "vpn-lab2 exit (attacker target)" }

# target 9 (not 3) forces the strategy to open 3 channels to the lab relays even though the client
# already holds channels to other relays from a prior setup; a fresh client would use 3.
[strategy]
min_open_channels = 9
target_open_channels = 9

[strategy.channel_allowlist]
enabled = true
peers = ["0x5aa57436934c8874d4a5497ca31ae9a3beceaa15", "0x7bb0b2346eff494a5e7ed5ba873634be7e1547ca", "0xd0ecb3c14d9b9de6e718b4b6295ec6a62b6bba3b"]
